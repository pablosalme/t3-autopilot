name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Lint and format check (Biome); the result does not depend on the OS or Node version.
      - run: npm run lint
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
      - run: npm run typecheck
      # Vitest 5 needs Node 22.12+; on Node 20 only the runtime is checked (build + smoke).
      - run: npm test
        if: matrix.node != 20
      - run: npm run build
      - run: npm run smoke
      # End-to-end over stdio with the MCP SDK client (Node's test runner, so it runs on Node 20 too).
      - run: npm run test:e2e
      # npm pack, install the tarball in an empty project, run its bin and the end-to-end test against it.
      - run: npm run test:pack
