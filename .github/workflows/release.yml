name: Release

# Publishes the package on npm, with provenance, when a version tag is pushed.
# It signs in with npm trusted publishing (OIDC) and uses no npm token: on npmjs.com, the package must list
# this repository and this workflow file (release.yml, no environment) as a trusted publisher that may run
# `npm publish`. See https://docs.npmjs.com/trusted-publishers
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets npm trade the workflow's OIDC token for a short-lived publish credential and sign the
      # provenance statement with it.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history, to check that the tag is on main.
          fetch-depth: 0
      # No dependency cache here: the published files come from a clean install.
      # Node 24 comes with an npm that can publish with OIDC (11.5.1 or later; Node 24.5.0 was the first).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check that npm can publish with OIDC
        shell: bash
        run: |
          required=11.5.1
          current="$(npm --version)"
          if [ "$(printf '%s\n' "$required" "$current" | sort -V | head -n 1)" != "$required" ]; then
            echo "::error::npm $current cannot publish with OIDC: trusted publishing needs npm $required or later."
            exit 1
          fi
      - name: Check that the tag matches package.json, is on main and has a dated changelog entry
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in package.json."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main."
            exit 1
          fi
          # CHANGELOG.md goes into the package, and a published version cannot be changed: its entry must
          # carry the release date, not "Unreleased".
          if ! grep -Eq "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no \"## [$version] - YYYY-MM-DD\" heading: date the entry, then tag again."
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run smoke
      - run: npm run test:e2e
      - run: npm run test:pack
      # prepublishOnly runs lint, typecheck and the unit tests again; prepare rebuilds dist/ from scratch.
      # No NODE_AUTH_TOKEN: npm signs in with OIDC, and attaches the provenance statement on its own because
      # the repository and the package are public.
      - run: npm publish --access public
