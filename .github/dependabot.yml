version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      # @vitest/coverage-v8 must match vitest exactly.
      vitest:
        patterns: [vitest, "@vitest/*"]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Keep the types of the oldest supported Node.js (22, "engines" in package.json), so the code
      # cannot use an API that only a newer Node has. Raise it by hand together with "engines".
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
