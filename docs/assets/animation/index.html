<!doctype html>
<!--
  "How it works" animation for the README.
  Open it in a browser to watch it loop: index.html?lang=en&theme=light (lang: en | es, theme: light | dark).
  scripts/build-readme-animation.mjs loads it with &capture=1, calls window.renderAt(seconds) for every frame,
  takes a screenshot and turns the frames into docs/assets/how-it-works-{lang}-{theme}.gif.
  Everything is drawn from the time t, so every frame is deterministic. System fonts only, nothing external.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=880">
<title>t3-autopilot: how it works</title>
<style>
  :root {
    --page: #ffffff; --card: #f6f7fb; --line: #dfe2ea; --surface: #ffffff;
    --text: #1d2130; --muted: #5d6475; --accent: #5246e0; --accent-soft: #ecebfd;
    --red: #c9303b; --red-soft: #fbe9ea; --amber: #9a5b00; --amber-soft: #fdf1dc;
    --green: #1d7f3b; --green-soft: #e3f4e8;
    --claude: #d97757; --codex: #10a37f; --cursor: #6e7681; --grok: #3b82f6;
  }
  [data-theme="dark"] {
    --page: #0d1117; --card: #161b26; --line: #2c3444; --surface: #1e2533;
    --text: #e8ecf4; --muted: #a0a8b8; --accent: #8f87ff; --accent-soft: #2a2752;
    --red: #ff7b84; --red-soft: #3a2026; --amber: #f0b44c; --amber-soft: #3a2e17;
    --green: #4fd07a; --green-soft: #183524;
    --claude: #e8916f; --codex: #2fc79c; --cursor: #a3abb8; --grok: #6aa5ff;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 880px; height: 500px; overflow: hidden; background: var(--page); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text); -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #card {
    position: absolute; left: 10px; top: 10px; width: 860px; height: 480px;
    background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden;
  }
  .abs { position: absolute; }

  /* Top bar: name and the three steps. */
  #brand { left: 28px; top: 22px; font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 800; display: grid; place-items: center; letter-spacing: -0.5px;
  }
  #steps { right: 24px; top: 18px; display: flex; gap: 8px; }
  .step {
    display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 999px;
    font-size: 20px; font-weight: 600; color: var(--muted); border: 1px solid transparent;
  }
  .step .n {
    width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    font-size: 15px; font-weight: 700; background: var(--line); color: var(--muted);
  }
  .step.on { background: var(--surface); border-color: var(--line); color: var(--text); }
  .step.on .n { background: var(--accent); color: #fff; }

  .scene { left: 0; top: 0; width: 860px; height: 480px; }
  .box { background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; }
  .title { font-size: 24px; font-weight: 700; }
  .muted { color: var(--muted); }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 4px 14px;
    font-size: 20px; font-weight: 600; white-space: nowrap;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }

  /* Scene 1: the task. */
  #agent { left: 36px; top: 92px; width: 404px; height: 236px; padding: 22px 24px; }
  #agent .head { display: flex; align-items: center; justify-content: space-between; }
  #task { margin-top: 18px; padding: 16px 18px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
  #task .text { font-size: 24px; line-height: 1.3; font-weight: 600; }
  #task .tag { margin-top: 12px; background: var(--accent-soft); color: var(--accent); }
  #arrow { left: 452px; top: 202px; width: 118px; height: 24px; }
  #autopilot { left: 584px; top: 128px; width: 244px; height: 164px; padding: 22px; text-align: center; }
  #autopilot .logo { width: 44px; height: 44px; font-size: 20px; border-radius: 12px; margin: 0 auto 10px; }
  #question { margin-top: 10px; font-size: 24px; font-weight: 700; color: var(--accent); }

  /* Scene 2: the decision. */
  #prefs { left: 42px; top: 92px; display: flex; align-items: center; gap: 10px; font-size: 22px; }
  .fam { background: var(--surface); border: 1.5px solid var(--line); }
  .fam b { color: var(--accent); }
  #have { left: 42px; top: 160px; font-size: 22px; }
  .chip {
    top: 204px; width: 192px; height: 88px; padding: 12px 14px; display: flex; flex-direction: column; justify-content: center; gap: 4px;
  }
  .chip .name { font-size: 23px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .chip .model { font-size: 18px; color: var(--muted); }
  .strike { position: absolute; left: 14px; right: 14px; top: 43px; height: 2.5px; background: var(--red); transform-origin: left center; }
  .badge { top: 306px; width: 192px; display: flex; justify-content: center; }
  .badge .pill { font-size: 19px; }
  .badge.red .pill { background: var(--red-soft); color: var(--red); }
  .badge.amber .pill { background: var(--amber-soft); color: var(--amber); }

  /* Scene 3: the answer. */
  .row {
    left: 40px; width: 780px; height: 62px; padding: 0 20px 0 14px; display: flex; align-items: center; gap: 14px;
  }
  .row .rank {
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none;
    font-size: 18px; font-weight: 700; background: var(--line); color: var(--text);
  }
  .row .prov { font-size: 23px; font-weight: 700; width: 92px; display: flex; align-items: center; gap: 8px; }
  .row .model { font-size: 21px; width: 200px; }
  .row .why { font-size: 21px; color: var(--muted); margin-left: auto; text-align: right; white-space: nowrap; }
  .row .hl { position: absolute; inset: -1.5px; border-radius: 18px; border: 2.5px solid var(--accent); background: var(--accent-soft); z-index: -1; }
  .row { isolation: isolate; }
  #started { left: 40px; top: 326px; width: 780px; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 23px; font-weight: 600; }
  .check { width: 30px; height: 30px; border-radius: 50%; background: var(--green); display: grid; place-items: center; }

  /* Caption. */
  #captions { left: 0; top: 404px; width: 860px; height: 76px; border-top: 1px solid var(--line); }
  .cap {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 600; text-align: center; padding: 0 24px;
  }
</style>
</head>
<body>
<div id="card">
  <div id="brand" class="abs"><span class="logo">t3</span>t3-autopilot</div>
  <div id="steps" class="abs">
    <div class="step" data-step="0"><span class="n">1</span><span data-t="step1"></span></div>
    <div class="step" data-step="1"><span class="n">2</span><span data-t="step2"></span></div>
    <div class="step" data-step="2"><span class="n">3</span><span data-t="step3"></span></div>
  </div>

  <!-- Scene 1 -->
  <div id="s1" class="abs scene">
    <div id="agent" class="abs box">
      <div class="head">
        <span class="title" data-t="agent"></span>
        <span class="pill fam"><span class="dot" style="background:var(--claude)"></span>Claude</span>
      </div>
      <div id="task">
        <div class="text" data-t="task"></div>
        <span class="pill tag">review</span>
      </div>
    </div>
    <svg id="arrow" class="abs" viewBox="0 0 118 24" fill="none">
      <line id="arrowLine" x1="2" y1="12" x2="104" y2="12" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="102" />
      <path id="arrowHead" d="M100 3 L114 12 L100 21" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <div id="autopilot" class="abs box">
      <div class="logo">t3</div>
      <div class="title">t3-autopilot</div>
      <div id="question" data-t="question"></div>
    </div>
  </div>

  <!-- Scene 2 -->
  <div id="s2" class="abs scene">
    <div id="prefs" class="abs">
      <span class="muted" data-t="prefs"></span>
      <span class="pill fam"><b>1</b>GPT</span>
      <span class="pill fam"><b>2</b>Gemini</span>
      <span class="pill fam"><b>3</b>Grok</span>
    </div>
    <div id="have" class="abs muted" data-t="have"></div>
    <div id="chipClaude" class="abs box chip"><div class="name"><span class="dot" style="background:var(--claude)"></span>Claude</div><div class="model mono">claude-opus-6</div><div class="strike"></div></div>
    <div id="chipCodex" class="abs box chip"><div class="name"><span class="dot" style="background:var(--codex)"></span>Codex</div><div class="model mono">gpt-6.2-codex</div></div>
    <div id="chipCursor" class="abs box chip"><div class="name"><span class="dot" style="background:var(--cursor)"></span>Cursor</div><div class="model mono">gemini-5.1-pro</div></div>
    <div id="chipGrok" class="abs box chip"><div class="name"><span class="dot" style="background:var(--grok)"></span>Grok</div><div class="model mono">grok-6</div></div>
    <div id="badgeClaude" class="abs badge red"><span class="pill" data-t="badgeAgent"></span></div>
    <div id="badgeCursor" class="abs badge amber"><span class="pill" data-t="badgeQuota"></span></div>
  </div>

  <!-- Scene 3 -->
  <div id="s3" class="abs scene">
    <div id="row1" class="abs box row" style="top:90px"><div class="hl"></div><span class="rank">1</span><span class="prov"><span class="dot" style="background:var(--codex)"></span>Codex</span><span class="model mono">gpt-6.2-codex</span><span class="why" data-t="why1"></span></div>
    <div id="row2" class="abs box row" style="top:166px"><span class="rank">2</span><span class="prov"><span class="dot" style="background:var(--grok)"></span>Grok</span><span class="model mono">grok-6</span><span class="why" data-t="why2"></span></div>
    <div id="row3" class="abs box row" style="top:242px"><span class="rank">3</span><span class="prov"><span class="dot" style="background:var(--cursor)"></span>Cursor</span><span class="model mono">gemini-5.1-pro</span><span class="why" data-t="why3"></span></div>
    <div id="started" class="abs">
      <span class="check"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3.5 9.5 L7.5 13 L14.5 5" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span data-t="started"></span><span class="mono" style="color:var(--accent)">gpt-6.2-codex</span>
    </div>
  </div>

  <div id="captions" class="abs">
    <div class="cap" data-cap="c1"></div>
    <div class="cap" data-cap="c2a"></div>
    <div class="cap" data-cap="c2b"></div>
    <div class="cap" data-cap="c2c"></div>
    <div class="cap" data-cap="c3a"></div>
    <div class="cap" data-cap="c3b"></div>
  </div>
</div>

<script>
  const TEXT = {
    en: {
      step1: "Ask", step2: "Decide", step3: "Answer",
      agent: "Your agent", task: "Review the PR that moves auth checks", question: "Which model?",
      prefs: "Reviews: you prefer", have: "Models you have",
      badgeAgent: "Your agent's", badgeQuota: "Out of quota",
      why1: "Newest GPT you have", why2: "Next on your list", why3: "Out of quota, so last",
      started: "Helper started on",
      c1: "Your agent has a task and asks which model to use.",
      c2a: "It matches your preferences with the models you have.",
      c2b: "A review needs a second opinion: not your agent's Claude.",
      c2c: "A provider with no quota left goes last.",
      c3a: "Up to three options, best first, each with its reason.",
      c3b: "Your agent starts the helper on the first one.",
    },
    es: {
      step1: "Pregunta", step2: "Decide", step3: "Responde",
      agent: "Tu agente", task: "Revisa el PR que mueve las comprobaciones de auth", question: "¿Qué modelo?",
      prefs: "Al revisar prefieres", have: "Modelos que tienes",
      badgeAgent: "Es tu agente", badgeQuota: "Sin cuota",
      why1: "Tu GPT más reciente", why2: "El siguiente de tu lista", why3: "Sin cuota: al final",
      started: "Ayudante en marcha con",
      c1: "Tu agente tiene una tarea y pregunta qué modelo usar.",
      c2a: "Cruza tus preferencias con los modelos que tienes.",
      c2b: "Una revisión pide otra opinión: no el Claude de tu agente.",
      c2c: "Un proveedor sin cuota pasa al final.",
      c3a: "Hasta tres opciones, la mejor primero y con su motivo.",
      c3b: "Tu agente arranca el ayudante con la primera.",
    },
  };

  const params = new URLSearchParams(location.search);
  const lang = TEXT[params.get("lang")] ? params.get("lang") : "en";
  const theme = params.get("theme") === "dark" ? "dark" : "light";
  document.documentElement.lang = lang;
  document.documentElement.dataset.theme = theme;
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = TEXT[lang][el.dataset.t];
  for (const el of document.querySelectorAll("[data-cap]")) el.textContent = TEXT[lang][el.dataset.cap];

  /** Length of the loop in seconds; the last 4 s before the fade-out show the finished state. */
  window.DURATION = 18.4;

  const $ = (id) => document.getElementById(id);
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2);
  /** 0 before `start`, 1 after `start + dur`, eased in between. */
  const p = (t, start, dur = 0.5) => ease(clamp((t - start) / dur));
  /** Visible between `a` and `b`, with a fade of `f` seconds at each end. */
  const span = (t, a, b, f = 0.4) => Math.min(p(t, a, f), 1 - p(t, b - f, f));
  const lerp = (a, b, k) => a + (b - a) * k;
  function show(el, k, dy = 14) {
    el.style.opacity = k;
    el.style.transform = `translateY(${(1 - k) * dy}px)`;
  }

  const CHIP_X = [32, 234, 436, 638];
  const capTimes = { c1: [0.6, 4.6], c2a: [5.0, 6.6], c2b: [6.6, 8.1], c2c: [8.1, 10.8], c3a: [11.1, 13.2], c3b: [13.2, 18.0] };

  window.renderAt = (t) => {
    // Steps in the top bar.
    const step = t < 4.6 ? 0 : t < 10.8 ? 1 : 2;
    for (const el of document.querySelectorAll(".step")) el.classList.toggle("on", Number(el.dataset.step) === step && t < 18.0);

    // Scene 1: the agent has a task and asks.
    const s1 = span(t, 0, 4.6);
    $("s1").style.opacity = s1;
    show($("agent"), p(t, 0.1, 0.6));
    show($("task"), p(t, 0.7, 0.5), 10);
    const arrow = p(t, 1.6, 0.7);
    $("arrowLine").style.strokeDashoffset = 102 * (1 - arrow);
    $("arrowHead").style.opacity = p(t, 2.2, 0.2);
    show($("autopilot"), p(t, 0.4, 0.6));
    const asked = p(t, 2.3, 0.4);
    $("autopilot").style.borderColor = asked > 0 ? `color-mix(in srgb, var(--accent) ${asked * 100}%, var(--line))` : "";
    show($("question"), asked, 8);

    // Scene 2: preferences against the models you have.
    $("s2").style.opacity = span(t, 4.6, 10.8);
    show($("prefs"), p(t, 4.9, 0.5));
    show($("have"), p(t, 5.4, 0.5));
    const chips = ["chipClaude", "chipCodex", "chipCursor", "chipGrok"];
    chips.forEach((id, i) => show($(id), p(t, 5.6 + i * 0.15, 0.45)));
    // Claude is the agent's own provider: a review goes elsewhere.
    const out = p(t, 6.8, 0.5);
    $("chipClaude").style.opacity = Math.min(p(t, 5.6, 0.45), 1 - 0.55 * out);
    $("chipClaude").querySelector(".strike").style.transform = `scaleX(${out})`;
    show($("badgeClaude"), p(t, 6.9, 0.4), 8);
    $("badgeClaude").style.left = `${CHIP_X[0]}px`;
    // Cursor has no quota left: it swaps places with Grok and goes last.
    const quota = p(t, 8.3, 0.4);
    const move = p(t, 8.8, 0.7);
    $("chipCodex").style.left = `${CHIP_X[1]}px`;
    $("chipCursor").style.left = `${lerp(CHIP_X[2], CHIP_X[3], move)}px`;
    $("chipGrok").style.left = `${lerp(CHIP_X[3], CHIP_X[2], move)}px`;
    $("chipClaude").style.left = `${CHIP_X[0]}px`;
    // Cursor passes below Grok on an arc, so the two never sit on top of each other.
    const arc = Math.sin(Math.PI * move);
    if (move > 0) {
      $("chipCursor").style.transform = `translateY(${arc * 58}px)`;
      $("chipGrok").style.transform = `translateY(${-arc * 12}px)`;
    }
    $("badgeCursor").style.top = `${306 + arc * 58}px`;
    $("chipCursor").style.borderColor = quota > 0 ? `color-mix(in srgb, var(--amber) ${quota * 100}%, var(--line))` : "";
    show($("badgeCursor"), quota, 8);
    $("badgeCursor").style.left = `${lerp(CHIP_X[2], CHIP_X[3], move)}px`;

    // Scene 3: the answer, best first; the first one starts.
    $("s3").style.opacity = span(t, 10.8, 18.4, 0.5);
    ["row1", "row2", "row3"].forEach((id, i) => show($(id), p(t, 11.1 + i * 0.3, 0.5)));
    const pick = p(t, 12.8, 0.5);
    $("row1").querySelector(".hl").style.opacity = pick;
    $("row1").querySelector(".rank").style.background = pick > 0 ? `color-mix(in srgb, var(--accent) ${pick * 100}%, var(--line))` : "";
    $("row1").querySelector(".rank").style.color = pick > 0.5 ? "#fff" : "";
    $("row2").style.opacity = Math.min(p(t, 11.4, 0.5), 1 - 0.35 * pick);
    $("row3").style.opacity = Math.min(p(t, 11.7, 0.5), 1 - 0.35 * pick);
    show($("started"), p(t, 13.4, 0.5), 10);

    // Captions.
    for (const el of document.querySelectorAll("[data-cap]")) {
      const [a, b] = capTimes[el.dataset.cap];
      el.style.opacity = span(t, a, b, 0.3);
    }
  };

  if (params.has("capture")) {
    window.renderAt(0);
  } else {
    const t0 = performance.now();
    const tick = (now) => {
      window.renderAt(((now - t0) / 1000) % window.DURATION);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
</script>
</body>
</html>
